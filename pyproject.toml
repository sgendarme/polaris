[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polaris"
version = "1.0.0"
description = "POLARIS: patterns over local cohorts for auditable recommendation in strict cold start (paper reproduction package)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.14",
]

[project.optional-dependencies]
# Learned baselines and the ML-1M set selector.
full = [
    "torch>=2.4",
    "lightgbm>=4.3",
]
[tool.setuptools.packages.find]
where = ["src"]
